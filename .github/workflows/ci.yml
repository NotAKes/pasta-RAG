name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Ensure admin panel is bundled
        run: test -f dist/admin.html

  backend:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax check (compile all modules)
        run: |
          python -m compileall -q \
            api.py bot.py handlers.py main.py models.py \
            middleware.py lang_utils.py load_env.py get_context.py
      - name: Validate instruction.json is valid JSON
        run: python -c "import json; json.load(open('instruction.json', encoding='utf-8')); print('instruction.json OK')"

  docker:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env for compose validation
        run: touch .env
      - name: Validate compose file
        run: docker compose config -q

  deploy:
    name: Deploy to server
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    # Only deploy real pushes to master / manual runs — never on PRs.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      # The runner already has access to this (private) repo via the built-in
      # token, so we ship the code from here to the server over SSH instead of
      # having the server authenticate to GitHub itself.
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server
        run: |
          # Runtime state on the server must survive a deploy:
          #   .env             - secrets
          #   instruction.json - live menu edited via the admin panel
          #   static/images    - images uploaded via the admin panel
          #   model_weights / qdrant_storage / logs - runtime data
          # Excludes protect these from being overwritten (no --delete, so
          # they are never removed either).
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'instruction.json' \
            --exclude 'static/images' \
            --exclude 'model_weights' \
            --exclude 'qdrant_storage' \
            --exclude 'logs' \
            --exclude 'frontend/node_modules' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && docker compose up -d --build --remove-orphans && docker image prune -f"
