[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pastabar-ai"
version = "2.0.0"
description = "Restaurant ordering and a grounded bilingual AI assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn>=0.40,<0.41",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "sqlalchemy[asyncio]>=2.0.46,<2.1",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.31,<1",
  "aiogram>=3.24,<4",
  "redis>=5,<8",
  "openai>=2.16,<3",
  "Pillow>=12.1,<13",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=5.2,<6", "qdrant-client>=1.12,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["pastabar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
