name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Ensure admin panel is bundled
        run: test -f dist/admin.html

  backend:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax check (compile all modules)
        run: |
          python -m compileall -q \
            api.py bot.py handlers.py main.py models.py \
            middleware.py lang_utils.py load_env.py get_context.py
      - name: Validate instruction.json is valid JSON
        run: python -c "import json; json.load(open('instruction.json', encoding='utf-8')); print('instruction.json OK')"

  docker:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env for compose validation
        run: touch .env
      - name: Validate compose file
        run: docker compose config -q

  deploy:
    name: Deploy to server
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    # Only deploy real pushes to master / manual runs — never on PRs.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # instruction.json (the menu) and uploaded images are edited at
            # runtime via the admin panel. Preserve the live menu so a deploy
            # never overwrites admin changes with the git seed version.
            cp instruction.json /tmp/pastabar_instruction.bak || true

            git fetch origin master
            git reset --hard origin/master

            # Restore the live, admin-edited menu over the git version.
            cp /tmp/pastabar_instruction.bak instruction.json || true

            # Rebuild and restart. Uploaded images live in ./static/images
            # (a mounted volume) and are untracked, so they are not touched.
            docker compose up -d --build --remove-orphans
            docker image prune -f
