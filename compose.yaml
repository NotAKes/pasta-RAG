services:
  bot:
    build: .
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2.8G # Основная часть памяти под ML-модель
    volumes:
      - ./model_weights:/app/hf_cache
      - ./instruction.json:/app/instruction.json
      - ./static/images:/app/static/images
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

    env_file:
        - .env
    # Порт 8000 теперь не пробрасываем наружу, его заберет Caddy

  db:
    image: postgres:15-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 500M
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=notakes
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Caddy сам подхватит твой домен и сделает HTTPS
    # command: caddy reverse-proxy --from pastamoalboal.shop --to bot:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
