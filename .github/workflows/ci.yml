name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Ensure admin panel is bundled
        run: test -f dist/admin.html

  backend:
    name: Validate backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax check (compile all modules)
        run: |
          python -m compileall -q \
            api.py bot.py handlers.py main.py models.py \
            middleware.py lang_utils.py load_env.py get_context.py
      - name: Validate instruction.json is valid JSON
        run: python -c "import json; json.load(open('instruction.json', encoding='utf-8')); print('instruction.json OK')"

  docker:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env for compose validation
        run: touch .env
      - name: Validate compose file
        run: docker compose config -q
